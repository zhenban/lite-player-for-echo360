# Draws the public usage chart (daily active users, totals only) from the telemetry database
# once a day and publishes it on the `stats` branch, which holds just the two SVGs (replaced
# each time, no history). See telemetry-admin/README.md, "Public usage chart".
name: Usage chart

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: usage-chart
  cancel-in-progress: false

jobs:
  chart:
    name: Draw and publish
    if: github.repository == 'zhenban/lite-player-for-echo360'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # No npm install: the script uses only Node and the dashboard's own query check.
      - name: Draw
        working-directory: telemetry-admin
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: node chart/usage-chart.mjs "$RUNNER_TEMP/stats"
      - name: Publish on the stats branch
        working-directory: ${{ runner.temp }}/stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b stats
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add usage-light.svg usage-dark.svg
          git commit -q -m 'Usage chart'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" stats
