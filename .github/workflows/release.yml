name: Release
# Pushing a tag vX.Y.Z publishes a GitHub release with the userscript attached and that
# version's section of CHANGELOG.md as the notes. "Run workflow" (Actions tab) does the same
# for a tag that already exists (for tags made before this workflow).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.14.0)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # The tag comes in through the environment, never pasted into the script, and must
      # look like vX.Y.Z before anything uses it.
      - name: Which tag
        env:
          WANTED: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$WANTED" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a release tag: $WANTED"; exit 1; }
          echo "TAG=$WANTED" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag matches VERSION
        run: test "v$(cat VERSION)" = "$TAG"
      - name: Checks (lint, types, tests, dist/ in sync)
        run: npm run ci
      - name: Notes from CHANGELOG.md
        run: |
          awk -v v="## $(cat VERSION)" '$0 == v {on = 1; next} on && /^## / {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
          printf '\n---\nInstall: open the attached `lite-player-for-echo360.user.js` with Tampermonkey or Violentmonkey installed. Or the Chrome or Edge extension from the [Chrome Web Store](https://chromewebstore.google.com/detail/lite-player-for-echo360/bbcmnjnijjfpnngkkgoahjljibfackbh) (it updates itself; the store may take a few days to offer a new version). The attached `lite-player-for-echo360-extension-%s.zip` is the same extension for a manual install (`chrome://extensions`, Developer mode, Load unpacked). Use one or the other, not both.\n' "$(cat VERSION)" >> notes.md
      - name: The Chrome extension
        run: |
          npm run build-extension
          cp dist-extension.zip "lite-player-for-echo360-extension-$(cat VERSION).zip"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/lite-player-for-echo360.user.js "lite-player-for-echo360-extension-$(cat VERSION).zip" --title "Lite Player for Echo360 $TAG" --notes-file notes.md --verify-tag
