# Cloudflare Worker for the anonymous usage data (README.md: deploying, queries, deleting).
# Holds no secrets: the database id only names the database within the account that owns it.
name = "lite-player-telemetry"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# No logs of requests: no Workers Logs, no traces (nothing here writes to the console either).
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "telemetry"
database_id = "d9006e7d-abf7-47d0-946e-ce732bd77a82"
migrations_dir = "migrations"

# Requests per minute from one address (the address is only the counter's key).
[[ratelimits]]
name = "EVENTS_LIMIT"
namespace_id = "41001"
simple = { limit = 30, period = 60 }

# Viewing and deleting one's data: few requests are ever needed.
[[ratelimits]]
name = "ME_LIMIT"
namespace_id = "41002"
simple = { limit = 5, period = 60 }
