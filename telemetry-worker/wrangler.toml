# Cloudflare Worker for the anonymous usage data (README.md: deploying, queries, deleting).
# Holds no secrets: the database id only names the database within the account that owns it.
name = "lite-player-telemetry"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# No logs of requests: no Workers Logs, no traces (nothing here writes to the console either).
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "telemetry"
database_id = "d9006e7d-abf7-47d0-946e-ce732bd77a82"
migrations_dir = "migrations"

# Requests per minute from one address (the address is only the counter's key).
[[ratelimits]]
name = "EVENTS_LIMIT"
namespace_id = "41001"
simple = { limit = 30, period = 60 }

# Viewing and deleting one's data: few requests are ever needed.
[[ratelimits]]
name = "ME_LIMIT"
namespace_id = "41002"
simple = { limit = 5, period = 60 }

# Registering (once per user, src/auth.js): a few a minute from one address.
[[ratelimits]]
name = "REG_LIMIT"
namespace_id = "41003"
simple = { limit = 3, period = 60 }

# Batches per minute from one user (the uid is the counter's key).
[[ratelimits]]
name = "UID_LIMIT"
namespace_id = "41004"
simple = { limit = 10, period = 60 }

# Daily: forget old batch ids and budget counters (src/index.js scheduled).
[triggers]
crons = ["17 3 * * *"]

# Against false data (README.md, "Abuse"). "1" turns a check from noting into refusing.
[vars]
ENFORCE_AUTH = "0"           # refuse unsigned batches (players before 0.25.0)
ENFORCE_MINT_POW = "0"       # refuse registrations without a valid proof of work
MINT_BITS = "18"             # zero bits the proof of work needs (README.md, "Abuse")
DAILY_WRITE_BUDGET = "60000" # rows written a day (D1 counts index entries too), of D1's 100,000
